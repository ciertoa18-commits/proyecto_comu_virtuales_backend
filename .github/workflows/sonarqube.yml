name: Pruebas y SonarQube

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analisis:
    name: Pruebas, cobertura y análisis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # En los pull requests solo se corren las pruebas; SonarCloud no logra
      # leer los PR de este repositorio y el análisis se hace al llegar a main.
      - name: Pruebas y cobertura (JaCoCo)
        if: github.event_name == 'pull_request'
        run: bash mvnw -B verify
      - name: Cache de SonarQube
        if: github.event_name == 'push'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2
        if: github.event_name == 'push'
        id: auth
      - name: Pruebas, cobertura (JaCoCo) y análisis de SonarQube
        if: github.event_name == 'push'
        run: >
          bash mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=ciertoa18-commits_proyecto_comu_virtuales_backend
          -Dsonar.organization=ciertoa18-commits
          -Dsonar.host.url=https://sonarcloud.io
          "-Dsonar.coverage.exclusions=**/entity/**,**/dto/**,**/enums/**,**/config/**"
