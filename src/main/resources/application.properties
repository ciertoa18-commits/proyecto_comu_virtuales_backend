spring.application.name=comunidades-backend
spring.config.import=optional:file:./comunidades-backend/.local/application-local.properties,optional:file:./.local/application-local.properties
server.port=8081
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//13.221.112.35:1521/orcl}
spring.datasource.username=${DB_USERNAME:comunidades}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
app.jwt.secret=${JWT_SECRET}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4200}
app.db.triggers-activos=${DB_TRIGGERS_ACTIVOS:false}
app.storage.directory=${STORAGE_DIRECTORY:./storage}
app.storage.type=${STORAGE_TYPE:local}
app.storage.s3.bucket=${S3_BUCKET:}
app.storage.s3.region=${AWS_REGION:us-east-1}
app.moderacion.palabras=${MODERATION_BLOCKED_WORDS:}

# --- Correo (recuperar contraseña). Si MAIL_HOST está vacío, el código se muestra en la consola ---
# Ejemplo Gmail: MAIL_HOST=smtp.gmail.com, MAIL_USERNAME=tucuenta@gmail.com,
# MAIL_PASSWORD=<contraseña de aplicación de 16 letras>
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-responder@perueduca.pe}}
