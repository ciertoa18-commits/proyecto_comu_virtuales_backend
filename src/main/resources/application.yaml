spring:
  application:
    name: comunidades-backend
  profiles:
    default: dev
  config:
    import: optional:file:./comunidades-backend/.local/application-local.properties,optional:file:./.local/application-local.properties
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//98.93.221.50:1521/orcl}
    username: ${DB_USERNAME:comunidades}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: America/Lima
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  mail:
    # Sin MAIL_HOST, el servicio actual muestra el codigo en consola.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${SERVER_PORT:8081}

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4200,http://localhost:4201}
  db:
    triggers-activos: ${DB_TRIGGERS_ACTIVOS:false}
  storage:
    directory: ${STORAGE_DIRECTORY:./storage}
    type: ${STORAGE_TYPE:local}
    s3:
      bucket: ${S3_BUCKET:}
      region: ${AWS_REGION:us-east-1}
  moderacion:
    palabras: ${MODERATION_BLOCKED_WORDS:}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:no-responder@perueduca.pe}}
